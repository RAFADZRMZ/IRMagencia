
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Lic. Itzel Ramírez Mujica</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
      color: #000;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .header {
      width: 100%;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 38px 15px 42px;
    }

    .photo {
      display: block;
      width: min(53vw, 245px);
      height: min(53vw, 245px);
      min-width: 180px;
      min-height: 180px;
      margin: 0 auto 24px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ddd;
    }

    .name {
      margin: 0;
      font-size: clamp(25px, 6.8vw, 32px);
      line-height: 1.15;
      font-weight: 700;
    }

    .position {
      margin: 10px 0 22px;
      font-size: clamp(19px, 5.2vw, 24px);
      line-height: 1.2;
      font-weight: 600;
    }

    .agency {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: 390px;
      margin: 0 auto;
    }

    .agency img {
      width: 52px;
      height: auto;
      object-fit: contain;
    }

    .agency span {
      font-size: clamp(12px, 3.1vw, 16px);
      line-height: 1.25;
      font-weight: 700;
      text-align: left;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      background: #fff;
      padding: 32px 12px 38px;
      gap: 34px 8px;
    }

    .contact-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      font-size: clamp(18px, 5.4vw, 26px);
      line-height: 1.12;
      font-weight: 700;
      min-width: 0;
    }

    .contact-icon {
      width: min(29vw, 135px);
      height: min(29vw, 135px);
      min-width: 92px;
      min-height: 92px;
      margin-bottom: 13px;
      border-radius: 50%;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contact-icon svg {
      width: 55%;
      height: 55%;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .social-title {
      width: 100%;
      min-height: 148px;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: clamp(30px, 8vw, 34px);
      line-height: 1.12;
      font-weight: 700;
      text-align: center;
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
      padding: 28px 20px 35px;
      background: #fff;
    }

    .social-item {
      height: 175px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .social-item img {
      width: min(28vw, 115px);
      height: min(28vw, 115px);
      object-fit: contain;
    }

    .separator {
      width: 88%;
      height: 5px;
      background: #000;
      margin: 0 auto 30px;
    }

    .qr-section {
      background: #fff;
      text-align: center;
      padding: 0 15px 40px;
    }

    .qr-title {
      margin: 0 0 20px;
      font-size: clamp(23px, 6vw, 28px);
      font-weight: 700;
    }

    .qr-code {
      display: block;
      width: 155px;
      height: 155px;
      object-fit: contain;
      margin: 0 auto 18px;
    }

    .scan-me {
      display: inline-block;
      background: #000;
      color: #fff;
      padding: 10px 24px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    @media (min-width: 700px) {
      body {
        max-width: 700px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>

  <!-- ENCABEZADO -->
  <header class="header">
    <img class="photo" src="assets/itzel.png" alt="Lic. Itzel Ramírez Mujica">

    <h1 class="name">Lic. Itzel Ramírez Mujica</h1>
    <p class="position">Directora Comercial</p>

    <div class="agency">
      <img src="assets/logo-agencia.png" alt="Logo de la agencia">
      <span>AGENCIA DE<br>MARKETING &amp; RELACIONES PÚBLICAS</span>
    </div>
  </header>

  <!-- CONTACTO -->
  <section class="contact-grid">

    <a class="contact-item" href="mailto:CORREO@EJEMPLO.COM">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="14" rx="1"/>
          <path d="m3 7 9 6 9-6"/>
        </svg>
      </div>
      <span>Enviar Email</span>
    </a>

    <a class="contact-item" href="tel:+52XXXXXXXXXX">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2
          19.79 19.79 0 0 1-8.63-3.07
          19.5 19.5 0 0 1-6-6
          A19.79 19.79 0 0 1 2.12 4.18
          2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72
          12.84 12.84 0 0 0 .7 2.81
          2 2 0 0 1-.45 2.11L8.09 9.91
          a16 16 0 0 0 6 6l1.27-1.27
          a2 2 0 0 1 2.11-.45
          12.84 12.84 0 0 0 2.81.7
          A2 2 0 0 1 22 16.92z"/>
        </svg>
      </div>
      <span>Llamar</span>
    </a>

    <a class="contact-item" href="https://wa.me/52XXXXXXXXXX" target="_blank" rel="noopener">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24">
          <path d="M21 11.5a8.38 8.38 0 0 1-9 8.5
          8.8 8.8 0 0 1-4-.9L3 20l1.1-4.5
          A8.4 8.4 0 1 1 21 11.5z"/>
          <path d="M8.5 8.5c.2-.4.4-.4.7-.4h.5
          c.2 0 .4.1.5.4l.7 1.5
          c.1.2.1.4-.1.6l-.5.6
          c.8 1.5 1.8 2.3 3.3 3.1l.6-.6
          c.2-.2.4-.2.6-.1l1.5.7
          c.3.1.4.3.3.5.6
          .1.4.1.9-.1 1.2"/>
        </svg>
      </div>
      <span>Enviar Mensaje</span>
    </a>

    <a class="contact-item" href="#" onclick="guardarContacto(event)">
      <div class="contact-icon">
        <svg viewBox="0 0 24 24">
          <circle cx="9" cy="8" r="3"/>
          <path d="M3 19c0-3 2.5-5 6-5s6 2 6 5"/>
          <path d="M19 8v6M16 11h6"/>
        </svg>
      </div>
      <span>Guardar<br>Contacto</span>
    </a>

  </section>

  <!-- REDES SOCIALES -->
  <section class="social-title">
    <span>Redes</span>
    <span>Sociales</span>
  </section>

  <section class="social-grid">

    <a class="social-item" href="https://www.instagram.com/TU_USUARIO" target="_blank" rel="noopener">
      <img src="assets/instagram.png" alt="Instagram">
    </a>

    <a class="social-item" href="https://www.threads.net/@TU_USUARIO" target="_blank" rel="noopener">
      <img src="assets/threads.png" alt="Threads">
    </a>

    <a class="social-item" href="https://www.facebook.com/TU_USUARIO" target="_blank" rel="noopener">
      <img src="assets/facebook.png" alt="Facebook">
    </a>

    <a class="social-item" href="https://www.tiktok.com/@TU_USUARIO" target="_blank" rel="noopener">
      <img src="assets/tiktok.png" alt="TikTok">
    </a>

  </section>

  <!-- QR -->
  <div class="separator"></div>

  <section class="qr-section">
    <h2 class="qr-title">Mi Código QR</h2>
    <img class="qr-code" src="assets/qr.png" alt="Código QR">
    <div class="scan-me">SCAN ME</div>
  </section>

  <script>
    function guardarContacto(event) {
      event.preventDefault();

      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "FN:Lic. Itzel Ramírez Mujica",
        "N:Ramírez Mujica;Itzel;;;",
        "TITLE:Directora Comercial",
        "ORG:AGENCIA DE MARKETING & RELACIONES PÚBLICAS",
        "EMAIL:CORREO@EJEMPLO.COM",
        "TEL;TYPE=CELL:+52XXXXXXXXXX",
        "URL:https://www.instagram.com/TU_USUARIO",
        "END:VCARD"
      ].join("\r\n");

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "Itzel_Ramirez_Mujica.vcf";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
